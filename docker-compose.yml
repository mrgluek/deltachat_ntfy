services:
  ntfy_bot:
    container_name: deltachat_ntfy_bot
    build: .
    restart: always
    volumes:
      - ./data:/app/data
      - ./data/ntfybot:/root/.config/ntfybot
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - DC_DB_DIR=/app/data
      - DB_PATH=/app/data/ntfy.db
      - AUTH_TOKEN= # Set this to a secret string to enable authentication
